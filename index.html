<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRINTFLOW STUDIO - Smart Print Queue & Document Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #f8f9fa !important; color: #1a1a2e; }
      html.dark, html.dark body { background-color: #0f0f14 !important; color: #e8e8f0; }
      html.neon, html.neon body { background-color: #0a0a0f !important; color: #e8e8f0; }
      #root { width: 100%; height: 100%; }
    </style>
    <script>
      (function () {
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark", "neon");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        const saved = localStorage.getItem('printflow-theme');
        applyThemeToDOM(saved || 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
